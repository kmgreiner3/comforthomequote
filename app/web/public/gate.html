<title>Preview access - Comfort Home Quote</title>
<style>
  :root {
    --navy-950: #0f1b33;
    --navy-800: #1d2e52;
    --blue-600: #2563c9;
    --blue-500: #3b82e8;
    --sky-50: #f2f6fc;
    --amber-400: #f5a623;
    --ink: #101828;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, var(--navy-800) 0%, var(--navy-950) 60%);
    font-family: "Bricolage Grotesque", "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--sky-50);
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    margin-bottom: 24px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #ffffff;
  }

  p.tagline {
    margin: 0 0 32px;
    font-size: 0.95rem;
    color: rgba(242, 246, 252, 0.7);
    line-height: 1.5;
  }

  form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid rgba(242, 246, 252, 0.18);
    background: rgba(255, 255, 255, 0.06);
    color: #ffffff;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  input[type="password"]::placeholder {
    color: rgba(242, 246, 252, 0.4);
  }

  input[type="password"]:focus {
    border-color: var(--blue-500);
    background: rgba(255, 255, 255, 0.1);
  }

  input[type="password"].shake {
    animation: shake 0.4s ease;
    border-color: #e5484d;
  }

  button {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: none;
    background: var(--blue-600);
    color: #ffffff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover {
    background: var(--blue-500);
  }

  button:active {
    transform: translateY(1px);
  }

  .error {
    min-height: 20px;
    margin-top: 4px;
    font-size: 0.875rem;
    color: #ff9b9e;
    visibility: hidden;
  }

  .error.visible {
    visibility: visible;
  }

  footer {
    margin-top: 40px;
    font-size: 0.75rem;
    color: rgba(242, 246, 252, 0.35);
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
</style>
</head>

    <h1>Preview access</h1>
    <p class="tagline">This site is a private preview of Comfort Home Quote. Enter the password to continue.</p>
    <form id="gate-form" autocomplete="off">
      <input id="password" name="password" type="password" placeholder="Password" autofocus />
      <button type="submit">Enter</button>
      <div id="error" class="error">That's not it. Check with Kyle or Dylan.</div>
    </form>
    <footer>Comfort Home Quote preview build</footer>
  </main>

  <script>
    (function () {
      var HASH = 'b70d2be5bb01a795017cc1d88adccb18a3c6f93dd0ce564a514affab1b432a5d';
      var form = document.getElementById('gate-form');
      var input = document.getElementById('password');
      var error = document.getElementById('error');

      function toHex(buffer) {
        var bytes = new Uint8Array(buffer);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) {
          var h = bytes[i].toString(16);
          hex += h.length === 1 ? '0' + h : h;
        }
        return hex;
      }

      function showError() {
        error.classList.add('visible');
        input.classList.remove('shake');
        // force reflow so the animation can replay on repeated wrong attempts
        void input.offsetWidth;
        input.classList.add('shake');
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var value = input.value || '';

        if (!window.crypto || !window.crypto.subtle) {
          showError();
          return;
        }

        var encoder = new TextEncoder();
        var data = encoder.encode(value);
        window.crypto.subtle.digest('SHA-256', data).then(function (digest) {
          var hex = toHex(digest);
          if (hex === HASH) {
            document.cookie = 'chq_preview=' + hex + '; Max-Age=2592000; Path=/; Secure; SameSite=Lax';
            location.replace('/');
          } else {
            showError();
          }
        }).catch(function () {
          showError();
        });
      });

      input.addEventListener('animationend', function () {
        input.classList.remove('shake');
      });

      input.addEventListener('input', function () {
        error.classList.remove('visible');
      });
    })();
  </script>
